<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineDB</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header style="font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">🎬 Cine Explorer</header>
    <div class="topBar">
      <div class="searchContainer">
        <input id="search" placeholder="Search movies" />
      </div>
      <div class="sortContainer">
        <div>
          <span class="sort_title">Sort by :</span>
          <button id="default">Default ☰</button>
          <button id="ratingHigh">⭐ Rating ↑</button>
          <button id="ratingLow">⭐ Rating ↓</button>
          <button id="yearNew">📅 Newest</button>
          <button id="showFav">❤️ Favourites</button>
        </div>
      </div>
      <button id="randomMovie">🎲 Random Night</button>
    </div>
      <div class="sectionTitle">Top Movies of All Time</div>
    <div id="result"></div>

    <script src="script.js"></script>
  </body>
</html>
