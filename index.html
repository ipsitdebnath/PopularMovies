<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMDB</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>🎬 Top 20 Movies of All Time</header>

    <div class="topBar">
      <div class="searchContainer">
        <input id="search" placeholder="Search movies" />
      </div>

      <div class="sortContainer">
        <button id="default">Default ☰</button>
        <button id="ratingHigh">⭐ Rating ↑</button>
        <button id="ratingLow">⭐ Rating ↓</button>
        <button id="yearNew">📅 Newest</button>
      </div>
    </div>
    <div id="result"></div>
    <script src="script.js"></script>
  </body>
</html>
